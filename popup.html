<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">SNATCHER</div>
    <div class="section" id="section"></div>
    <a href="#" id="openOptions" title="Settings">⚙</a>
  </header>

  <div id="setup" class="notice hidden">
    No download client set up yet.
    <button id="setupBtn" class="primary">Add a ruTorrent client</button>
  </div>

  <div id="toolbar" class="hidden">
    <label class="all"><input type="checkbox" id="selectAll"> All</label>
    <input type="search" id="filter" placeholder="Filter…">
    <select id="setAll" title="Set the folder for all selected"><option value="">Set selected to…</option></select>
  </div>

  <div id="list"></div>
  <div id="empty" class="notice hidden">No torrent links found on this page.</div>

  <footer id="footer" class="hidden">
    <span id="count"></span>
    <button id="send" class="primary" disabled>Snatch selected</button>
  </footer>

  <script src="lib/common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
